---
- name: Test Variable Precedence with Roles
  hosts: webservers
  become: yes
  vars:
    playbook_admin: "playbook-admin@alnafi.com"
  
  tasks:
    - name: Display variable sources
      debug:
        msg: |
          Server Admin: {{ server_admin | default('not set') }}
          Custom Message: {{ custom_message | default('not set') }}
          Webserver Port: {{ webserver_port | default('80') }}
    
    - name: Apply webserver role with mixed variables
      include_role:
        name: webserver
