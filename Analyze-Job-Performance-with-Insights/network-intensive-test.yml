---
- name: Network Intensive Performance Test
  hosts: all
  gather_facts: yes
  
  tasks:
    - name: Record start time
      set_fact:
        start_time: "{{ ansible_date_time.epoch }}"
    
    - name: Network intensive task - multiple file transfers
      get_url:
        url: "https://httpbin.org/bytes/{{ item }}"
        dest: "/tmp/test_file_{{ item }}.dat"
        timeout: 30
      loop:
        - 1024
        - 2048
        - 4096
      register: download_results
      ignore_errors: yes
      
    - name: Calculate total download time
      set_fact:
        total_download_time: "{{ download_results.results | map(attribute='elapsed') | sum }}"
        
    - name: Display network test results
      debug:
        msg: "Total download time: {{ total_download_time }} seconds"
        
    - name: Clean up test files
      file:
        path: "/tmp/test_file_{{ item }}.dat"
        state: absent
      loop:
        - 1024
        - 2048
        - 4096
        
    - name: Record performance metrics
      set_fact:
        end_time: "{{ ansible_date_time.epoch }}"
        duration: "{{ ansible_date_time.epoch | int - start_time | int }}"
        
    - name: Log performance metrics
      lineinfile:
        path: /tmp/performance_log.txt
        line: "{{ ansible_date_time.iso8601 }},NETWORK_TEST,{{ duration }},{{ inventory_hostname }}"
        create: yes
